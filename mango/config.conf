var=term,alacritty
tag_num=9

#MOUSE
mouse_accel_profile=2
mouse_accel_speed=-0.7

#MONITORS
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:180,x:1920,y:0,scale:1
focus_cross_monitor=1
exchange_cross_monitor=1

#AUTOSTART
exec_once= ~/.config/waybar/mango/waybar.sh
exec_once=swaybg -i /home/nanon/Pictures/sdc.jpg -m fill
exec_once=sh -c 'pkill wl-paste; env XDG_CACHE_HOME="$XDG_RUNTIME_DIR" wl-paste --type text --watch cliphist store'

#FLOATING
bind=SUPER+SHIFT,space,togglefloating
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#GAPS
gap_outer_horizontal=10
gap_outer_vertical=10
gap_inner_vertical=5
gap_inner_horizontal=10
smart_gaps=1

#BORDER
focus_color=0xA0E0EFFF
border_color=0x1B365DFF
split_color=0x1B365DFF
urgent_color=0xF70063FF

#LAYOUT
default_master_factor=0.5

#STATIC WINDOWS
window_rule=is_floating:1,width:800,height:600,offset_x:0,offset_y:0,app_id:.*pavucontrol$
window_rule=is_floating:1,width:800,height:600,offset_x:0,offset_y:0,app_id:.*mousepad$
window_rule=is_floating:1,offset_x:0,offset_y:0,app_id:^wofi$
window_rule=monitor:HDMI-A-2,tags:2,app_id:^google-chrome$
window_rule=monitor:HDMI-A-2,tags:3,app_id:^spotify$
window_rule=monitor:HDMI-A-2,tags:4,app_id:^vesktop$
window_rule=monitor:DP-3,tags:5,app_id:.*Sober$

#ROFI
#LAUNCHER
bind=SUPER,d,spawn,/home/nanon/.config/rofi/launchers/type-2/launcher.sh
#LAUNCHER
bind=SUPER+SHIFT,s,spawn,/home/nanon/.config/rofi/applets/bin/screenshot.sh
#POWER MENU
bind=SUPER,p,spawn,/home/nanon/.config/rofi/applets/bin/powermenu.sh

# -------------------- CLIPBOARD ---------------------------

bind=SUPER,v,spawn_shell,env XDG_CACHE_HOME=$XDG_RUNTIME_DIR cliphist list | wofi --dmenu --width=500 --height=400 --cache-file=/dev/null | env XDG_CACHE_HOME=$XDG_RUNTIME_DIR cliphist decode | wl-copy

# -------------------- TERMINAL AND SYSTEM -----------------

# Start terminal
bind=SUPER,Return,spawn,$term

# Kill focused window
bind=ALT,F4,killclient

# Reload configuration
bind=SUPER+SHIFT,c,reload_config

# Exit MangoWM
bind=SUPER+SHIFT,e,quit

# -------------------- FOCUS MOVEMENT ----------------------

# Arrow-key navigation
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move windows using Shift + arrow keys
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# -------------------- WORKSPACES / TAGS -------------------

# Switch to tags 1-9
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move focused window to tags 1-9
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# -------------------- WINDOW MANAGEMENT -------------------

# Fullscreen
bind=SUPER,f,togglefullscreen

# Reset the key mode for any subsequent configuration
key_mode=default
