var=term,alacritty
tag_num=9
circle_layout=grid,scroller,tile
bind=SUPER,n,switch_layout


#SCREENSHOT
bind=SUPER+SHIFT,s,spawn,~/.config/mango/screenshot.sh

#MOUSE
mouse_accel_profile=2
mouse_accel_speed=-0.7
mouse_scroll_method = 4
mouse_scroll_button = 274

#EMOJI PICKER
bind=SUPER,period,spawn,smile

#MONITORS
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitor_rule=name:^DP-3$,width:1920,height:1080,refresh:180,x:1920,y:0,scale:1
focus_cross_monitor=1
exchange_cross_monitor=1

#AUTOSTART
exec_once= ~/.config/waybar/mango/waybar.sh
exec_once=swaybg -i /home/nanon/Pictures/sdc.jpg -m fill
exec_once=copyq --start-server
exec_once=smile --start-hidden
exec_once=mmsg -o DP-3 -t 5

#ANIMATION
animation_type_open=zoom
animation_type_close=zoom
animation_duration_move=500
animation_duration_open=500
animation_duration_close=500
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_close=0.4,0.0,0.2,1.0
animation_curve_move=0.22,1.0,0.36,1.0
animation_curve_tag=0.22,1.0,0.36,1.0
animation_curve_focus=0.25,1.0,0.5,1.0
zoom_end_ratio=0.75


#BLUR
blur=1
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=5


#FLOATING
bind=SUPER,space,togglefloating
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#GAPS
gap_outer_horizontal=8
gap_outer_vertical=5
gap_inner_vertical=8
gap_inner_horizontal=8
smart_gaps=0

#BORDER
border_color=0x333333ff
focus_color=0x333333ff
border_px=2

#CORNER
border_radius=10
no_radius_when_single=0

#FOCUSED/UNFOCUSED
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000020

#LAYOUT
default_master_factor=0.5

#STATIC WINDOWS
#audio
window_rule=is_floating:1,width:1000,height:800,offset_x:0,offset_y:0,app_id:.*pavucontrol$
#text editor
window_rule=is_floating:1,width:1000,height:800,offset_x:0,offset_y:0,app_id:.*mousepad$
#img viewer
window_rule=is_floating:1,app_id:.*swayimg$
#clipboard
window_rule=is_floating:1,width:550,height:650,app_id:com.github.hluk.copyq
#file manger
window_rule=is_floating:1,width:1000,height:800,app_id:.*Nautilus$
#emoji picker
window_rule=is_floating:1,width:400,height:400,app_id:.*ssmile$
#calendar
window_rule=is_floating:1,width:420,height:520,offset_x:100,offset_y:-100,app_id:org.gnome.Calendar
#network
window_rule=is_floating:1,width:420,height:520,offset_x:100,offset_y:-100,app_id:nm-connection-editor
window_rule=monitor:HDMI-A-2,tags:2,app_id:^google-chrome$
window_rule=monitor:HDMI-A-2,tags:3,app_id:^Spotify$
window_rule=monitor:HDMI-A-2,tags:4,app_id:^vesktop$
window_rule=monitor:DP-3,tags:5,app_id:.*Sober$

#ROFI
#launcher
bind=SUPER,d,spawn,/home/nanon/.config/rofi/launchers/type-2/launcher.sh
#power menu
bind=SUPER,p,spawn,/home/nanon/.config/rofi/applets/bin/powermenu.sh

# -------------------- CLIPBOARD ---------------------------
bind=SUPER,V,spawn,copyq toggle
# -------------------- TERMINAL AND SYSTEM -----------------

# Start terminal
bind=SUPER,Return,spawn,$term
# Kill focused window
bind=ALT,F4,killclient
# Reload configuration
bind=SUPER+SHIFT,c,reload_config
# Exit MangoWM
bind=SUPER+SHIFT,e,quit

# -------------------- FOCUS MOVEMENT ----------------------

# Arrow-key navigation
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move windows using Super + Shift + arrow keys
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# -------------------- WORKSPACES / TAGS -------------------
# Switch to tags 1–4 on HDMI-A-2
bind=SUPER,1,viewcrossmon,1,HDMI-A-2
bind=SUPER,2,viewcrossmon,2,HDMI-A-2
bind=SUPER,3,viewcrossmon,3,HDMI-A-2
bind=SUPER,4,viewcrossmon,4,HDMI-A-2

# Move focused window to tags 1–4 on HDMI-A-2
bind=SUPER+SHIFT,1,tagcrossmon,1,HDMI-A-2
bind=SUPER+SHIFT,2,tagcrossmon,2,HDMI-A-2
bind=SUPER+SHIFT,3,tagcrossmon,3,HDMI-A-2
bind=SUPER+SHIFT,4,tagcrossmon,4,HDMI-A-2

# Switch to tags 5–9 on DP-3
bind=SUPER,5,viewcrossmon,5,DP-3
bind=SUPER,6,viewcrossmon,6,DP-3
bind=SUPER,7,viewcrossmon,7,DP-3
bind=SUPER,8,viewcrossmon,8,DP-3
bind=SUPER,9,viewcrossmon,9,DP-3

# Move focused window to tags 5–9 on DP-3
bind=SUPER+SHIFT,5,tagcrossmon,5,DP-3
bind=SUPER+SHIFT,6,tagcrossmon,6,DP-3
bind=SUPER+SHIFT,7,tagcrossmon,7,DP-3
bind=SUPER+SHIFT,8,tagcrossmon,8,DP-3
bind=SUPER+SHIFT,9,tagcrossmon,9,DP-3
# -------------------- WINDOW MANAGEMENT -------------------

# Fullscreen
bind=SUPER,f,togglefullscreen

# Reset the key mode for any subsequent configuration
key_mode=default


#idk
sync_obj_enable=1
allow_tearing=2
