[org/xfce/mousepad/state/application]
session=['1;;+']
enabled-plugins=['mousepad-plugin-gspell']

[org/xfce/mousepad/state/window]
width=996
height=796
maximized=false
fullscreen=false

[org/xfce/mousepad/preferences/view]
color-scheme='none'
show-line-numbers=false
font-name='Noto Sans CJK HK Medium 10'
use-default-monospace-font=false
word-wrap=false
auto-indent=true
tab-width=8

[org/xfce/mousepad/preferences/window]
toolbar-visible=true
statusbar-visible=false
menubar-visible=true

[org/xfce/mousepad/state/search]
highlight-all=false
